docs_dir: src/
site_dir: build/

# Guidance taken from:
#   https://towardsdatascience.com/full-guide-to-build-a-professionnal-portfolio-with-python-markdown-git-and-github-page-for-66d12f7859f0/

site_name: Casey Walker
site_url: https://kcmw3e.github.io/
site_author: Casey Walker
site_description: >-
  This is the profile portfolio for Casey Walker, a human being.

repo_name: kcmw3e/kcmw3e.github.io
repo_url: hittps://github.com/kcmw3e/kcmw3e.github.io

theme:
  name: material
  palette:
    # Light and dark theme with toggle, based on the MkDocs Material
    # documentation:
    #   https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
